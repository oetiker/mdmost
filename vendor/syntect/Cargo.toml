# Vendored, not ours. See VENDORED.md for the upstream commit, what this tree carries,
# and the conditions under which the whole `vendor/` directory goes away.
#
# This file is NOT upstream's verbatim. It is upstream's manifest with everything that
# only served a full checkout removed: the benches, the eight examples, the
# `public_api` test target (needs `public-api`, `rustdoc-json` and `rustup-toolchain`,
# which spawn a second toolchain) and the dev-dependencies those needed. What is left is
# the library, its dependencies exactly as upstream declared them, and the one test file
# that runs under the standard harness with no extra dev-dependency.

[package]
edition = "2021"
name = "syntect"
version = "5.3.0"
authors = ["Tristan Hume <tristan@thume.ca>"]
build = false
exclude = [
    "testdata/*",
    "/scripts/*",
    "/Makefile",
    "/codecov.yml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "library for high quality syntax highlighting and code intelligence using Sublime Text's grammars"
documentation = "https://docs.rs/syntect"
readme = "Readme.md"
keywords = [
    "syntax",
    "highlighting",
    "highlighter",
    "colouring",
    "parsing",
]
categories = [
    "parser-implementations",
    "parsing",
    "text-processing",
]
license = "MIT"
repository = "https://github.com/trishume/syntect"
# A path dependency cannot be published, and this tree is not ours to publish anyway.
# This says so out loud rather than leaving it to `cargo publish` to discover.
publish = false

[package.metadata.docs.rs]
features = ["metadata"]

[features]
# Upstream's default is default-onig, which pulls in onig -> onig_sys, whose
# build-dependencies are cc and pkg-config -- a C toolchain. "No C toolchain in the
# build, ever" is a load-bearing decision in the root Cargo.toml (mdmost's own
# musl static build depends on it), and mdmost's product dependency line already
# pins default-features = false, features = ["default-fancy"], so the product build
# was never affected. But a bare `cargo test -p syntect` -- CI's own invocation, and
# what VENDORED.md tells a developer to run -- built onig anyway, because this
# manifest's own default still named the onig feature. Changed here instead of only
# at each call site, so every invocation gets it, including one nobody wrote a flag
# for, and so syntect's own suite tests the exact configuration mdmost ships.
default = ["default-fancy"]
default-fancy = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "html",
    "plist-load",
    "yaml-load",
    "dump-load",
    "dump-create",
    "regex-fancy",
]
default-onig = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "html",
    "plist-load",
    "yaml-load",
    "dump-load",
    "dump-create",
    "regex-onig",
]
default-syntaxes = [
    "parsing",
    "dump-load",
]
default-themes = ["dump-load"]
dump-create = [
    "flate2",
    "bincode",
]
dump-load = [
    "flate2",
    "bincode",
]
html = ["parsing"]
metadata = [
    "parsing",
    "plist-load",
    "dep:serde_json",
]
parsing = [
    "regex-syntax",
    "fnv",
    "dump-create",
    "dump-load",
]
plist-load = [
    "plist",
    "dep:serde_json",
]
regex-fancy = ["fancy-regex"]
regex-onig = ["onig"]
yaml-load = [
    "yaml-rust",
    "parsing",
]

[lib]
name = "syntect"
path = "src/lib.rs"
bench = false

[[test]]
name = "error_handling"
path = "tests/error_handling.rs"

[dependencies.bincode]
version = "1.0"
optional = true

[dependencies.fancy-regex]
version = "0.16.2"
optional = true

[dependencies.flate2]
version = "1.0"
optional = true

[dependencies.fnv]
version = "1.0"
optional = true

[dependencies.once_cell]
version = "1.8"

[dependencies.onig]
version = "6.5.1"
optional = true
default-features = false

[dependencies.plist]
version = "1.3"
optional = true

[dependencies.regex-syntax]
version = "0.8"
optional = true

[dependencies.serde]
version = "1.0"

[dependencies.serde_derive]
version = "1.0"

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.thiserror]
version = "2.0.12"

[dependencies.walkdir]
version = "2.0"

[dependencies.yaml-rust]
version = "0.4.5"
optional = true

[dev-dependencies.pretty_assertions]
version = "0.6"

[dev-dependencies.rayon]
version = "1.0.0"

[dev-dependencies.serde_json]
version = "1.0"

# Allows everything, on purpose: insurance against a toolchain bump that introduces a
# lint nobody here is going to fix in someone else's frozen code. It is not what keeps
# mdmost's gate off this crate, though -- a lint level named on the command line
# (`-D warnings`) overrides a crate's own `[lints]` table, not the other way around, so
# `cargo clippy -p mdmost -- -D warnings` still fails here without `--no-deps` (that flag
# is what mdmost's gate actually uses; see `.github/workflows/ci.yml`). What this table
# does do: it keeps a plain `cargo clippy -p syntect`, run with no extra flags, silent.
# If this tree ever stops being read-only, delete this table rather than the scoping.
[lints.rust]
warnings = "allow"

[lints.clippy]
all = "allow"
