[package]
name = "mdless"
version = "0.1.0"
edition = "2024"
description = "A full-screen terminal pager for a single Markdown document"
license = "MIT"
repository = "https://github.com/oetiker/mdless"

[lib]
name = "mdless"
path = "src/lib.rs"

[[bin]]
name = "mdless"
path = "src/main.rs"

[features]
default = ["clipboard"]
# The local display server's clipboard, as the belt-and-braces second half of a copy
# (`src/tui/clipboard.rs`). OSC 52 is written unconditionally and needs no dependency;
# this is what lets the status bar say "copied" instead of "sent", and it is what makes
# a copy work on a terminal that refuses OSC 52. Optional because it links against
# X11/Wayland, which is not something to force on a build for a headless box: without
# it the pager still copies, it simply cannot confirm it.
clipboard = ["dep:arboard"]

[dependencies]
anyhow = "1.0.104"
# `default-features = false` drops `image-data`, which would pull in the whole `image`
# crate to support copying bitmaps — this copies text. `wayland-data-control` is asked
# for explicitly so a Wayland session is not silently served by XWayland alone.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
], optional = true }
clap = { version = "4.6.6", features = ["derive"] }
compact_str = "0.10.0"
comrak = { version = "0.54.0", default-features = false }
# Kept in lock step with the crossterm version ratatui 0.30 depends on.
crossterm = "0.29.0"
directories = "6.0.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
# `default-fancy` swaps oniguruma for the pure-Rust `fancy-regex` engine, so the build
# needs no C toolchain. Same syntaxes, same themes, same API.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.20"
toml = "1.1.4"
# The syntax definitions `bat` curates — 213 of them against syntect's 2016-vintage 75,
# which had no TypeScript, Kotlin, Swift, Zig, Nix or even TOML. Roughly +0.6 MiB in the
# binary. `default-features = false` is load-bearing: the default feature is
# `syntect-onig`, which would drag oniguruma and a C toolchain into the build; the crate
# ships a separate dump built for `fancy-regex`, and `syntect-fancy` is the one that has
# to match syntect's `default-fancy` above. The definitions `fancy-regex` cannot compile
# (PowerShell, ARM assembly) are absent from that dump by design and fall back to plain
# text — README and design spec §8 say so.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# The event loop watches its own terminal descriptor for a hangup, which needs `poll`.
# `rustix` rather than `libc` because the crate forbids `unsafe`, and this is the same
# `poll` crossterm itself is built on. Linux only: `poll` on `/dev/tty` is documented
# not to work on macOS, and answering "your terminal is gone" wrongly would be worse
# than the spin this prevents.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["event"] }

[dev-dependencies]
insta = "1.48.0"
# `tests/pty_hangup.rs` builds a real pty and destroys it; that is raw `openpty`,
# `setsid` and `TIOCSCTTY` territory, which is fine in a test crate.
libc = "0.2.189"
portable-pty = "0.9.0"
pretty_assertions = "1.4.1"
proptest = "1.11.0"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
