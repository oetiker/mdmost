[package]
name = "mdmost"
version = "0.2.0"
edition = "2024"
description = "like less but for Markdown"
license = "MIT"
repository = "https://github.com/oetiker/mdmost"
readme = "README.md"
keywords = ["markdown", "pager", "terminal", "tui", "mermaid"]
categories = ["command-line-utilities", "text-processing"]
# The demo recording and the design docs are for readers of the repository, not for
# anyone building the crate, and the `.webp` is the largest file in the tree.
#
# `man/**` is here for a different reason: it is generated by `make man` and is not in
# git at all. Excluding it is what lets `cargo publish` run against a working tree that
# has just built the page, without `--allow-dirty`. Nothing is lost — `cargo install`
# does not install man pages, so the page inside the `.crate` was bytes no user could
# reach.
exclude = ["docs/**", "demo/**", "tests/corpus/**", "tests/snapshots/**", "man/**"]

[lib]
name = "mdmost"
path = "src/lib.rs"

[[bin]]
name = "mdmost"
path = "src/main.rs"

[features]
default = ["clipboard"]
# The local display server's clipboard, as the belt-and-braces second half of a copy
# (`src/tui/clipboard.rs`). OSC 52 is written unconditionally and needs no dependency;
# this is what lets the status bar say "copied" instead of "sent", and it is what makes
# a copy work on a terminal that refuses OSC 52. Optional because it links against
# X11/Wayland, which is not something to force on a build for a headless box: without
# it the pager still copies, it simply cannot confirm it.
clipboard = ["dep:arboard"]

[dependencies]
anyhow = "1.0.104"
# `default-features = false` drops `image-data`, which would pull in the whole `image`
# crate to support copying bitmaps — this copies text. `wayland-data-control` is asked
# for explicitly so a Wayland session is not silently served by XWayland alone.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
], optional = true }
clap = { version = "4.6.6", features = ["derive"] }
compact_str = "0.10.0"
comrak = { version = "0.54.0", default-features = false }
# Kept in lock step with the crossterm version ratatui 0.30 depends on.
crossterm = "0.29.0"
directories = "6.0.0"
# Not for logging anything of our own — `mdmost` has a status bar. This is the receiving
# end: `src/tui/stderr.rs` installs a logger so that a dependency's `warn!` is held back
# instead of being painted over the alternate screen. Already in the tree under
# `arboard`, which picks between `eprintln!` and `log::warn!` at run time and so has to
# be caught on both.
log = "0.4.33"
# The LaTeX front end: lexer, macro expander, symbol tables, environments and error
# recovery, as a pull parser. Its only dependency is `bumpalo`, a pure-Rust bump
# allocator with no build script; its one optional feature is `regex`, which stays
# off — so this adds no C toolchain, which is the same constraint recorded against
# `syntect` above. Writing the parser here instead would mean a TeX macro expander and
# some two thousand symbol definitions, for no gain: what this crate cannot supply is
# layout onto integer cells, and that is the part `src/math/` keeps.
pulldown-latex = { version = "0.8.0", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
# `default-fancy` swaps oniguruma for the pure-Rust `fancy-regex` engine, so the build
# needs no C toolchain. Same syntaxes, same themes, same API.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.20"
toml = "1.1.4"
# The syntax definitions `bat` curates — 213 of them against syntect's 2016-vintage 75,
# which had no TypeScript, Kotlin, Swift, Zig, Nix or even TOML. Roughly +0.6 MiB in the
# binary. `default-features = false` is load-bearing: the default feature is
# `syntect-onig`, which would drag oniguruma and a C toolchain into the build; the crate
# ships a separate dump built for `fancy-regex`, and `syntect-fancy` is the one that has
# to match syntect's `default-fancy` above. The definitions `fancy-regex` cannot compile
# (PowerShell, ARM assembly) are absent from that dump by design and fall back to plain
# text — README and design spec §8 say so.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# Two jobs, both of which would otherwise need `unsafe` in a crate that forbids it:
#
# * `event` — the event loop watches its own terminal descriptor for a hangup with
#   `poll`, the same `poll` crossterm itself is built on. Used on Linux only: `poll` on
#   `/dev/tty` is documented not to work on macOS, and answering "your terminal is gone"
#   wrongly would be worse than the spin it prevents.
# * `stdio` — `dup`/`dup2` on descriptor 2, so that a library writing to standard error
#   cannot scribble on the alternate screen (`src/tui/stderr.rs`). That one is wanted on
#   every unix, which is why the dependency is no longer Linux-only.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "stdio"] }

[dev-dependencies]
insta = "1.48.0"
# `tests/pty_hangup.rs` builds a real pty and destroys it; that is raw `openpty`,
# `setsid` and `TIOCSCTTY` territory, which is fine in a test crate.
libc = "0.2.189"
portable-pty = "0.9.0"
pretty_assertions = "1.4.1"
proptest = "1.11.0"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[package.metadata.deb]
maintainer = "Tobias Oetiker <tobi@oetiker.ch>"
copyright = "2026, Tobias Oetiker <tobi@oetiker.ch>"
license-file = ["LICENSE", "0"]
extended-description = """\
A full-screen terminal pager for a single Markdown document. Tables get real \
borders and negotiated column widths, fenced code is syntax-highlighted, and \
Mermaid diagrams are laid out as box art rather than shown as source. Rendering \
is a pure function of the document, width, theme and options, so a resize \
reflows everything. A single static binary."""
section = "utils"
priority = "optional"
# The desktop entry is installed for real, not as an example: this package is a
# system-wide install, so every user on the machine should be offered mdmost for a
# Markdown file. It only declares the capability -- no mimeapps.list is shipped, so
# the default stays each user's own choice. desktop-file-utils carries a dpkg trigger
# on /usr/share/applications, so update-desktop-database runs without a maintainer
# script of ours.
#
# The terminal fragments cannot be installed the same way. WezTerm and kitty each
# read one file owned by the user, and neither has a drop-in directory, so anywhere
# a package put them would be somewhere nothing reads. They go in as examples, at the
# path Debian Policy 12.6 names for them.
assets = [
    ["target/release/mdmost", "usr/bin/", "755"],
    ["man/mdmost.1", "usr/share/man/man1/", "644"],
    ["integrations/xdg/mdmost.desktop", "usr/share/applications/", "644"],
    ["README.md", "usr/share/doc/mdmost/README.md", "644"],
    ["LICENSE", "usr/share/doc/mdmost/LICENSE", "644"],
    ["integrations/README.md", "usr/share/doc/mdmost/examples/README.md", "644"],
    ["integrations/wezterm/md-open.lua", "usr/share/doc/mdmost/examples/wezterm/", "644"],
    ["integrations/kitty/open-actions.conf", "usr/share/doc/mdmost/examples/kitty/", "644"],
]

[package.metadata.generate-rpm]
summary = "Full-screen terminal pager for a single Markdown document"
license = "MIT"
# The musl builds are statically linked, so there is nothing to depend on — and the
# host's find-requires cannot inspect a cross-built aarch64 binary anyway.
auto-req = "no"
assets = [
    { source = "target/release/mdmost", dest = "/usr/bin/mdmost", mode = "755" },
    { source = "man/mdmost.1", dest = "/usr/share/man/man1/mdmost.1", mode = "644", doc = true },
    # Installed for real rather than as an example, and not doc: see the note above
    # the [package.metadata.deb] assets. desktop-file-utils carries an RPM file
    # trigger on this directory, so no scriptlet of ours is needed either.
    { source = "integrations/xdg/mdmost.desktop", dest = "/usr/share/applications/mdmost.desktop", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/mdmost/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/mdmost/LICENSE", mode = "644", doc = true },
    { source = "integrations/README.md", dest = "/usr/share/doc/mdmost/examples/README.md", mode = "644", doc = true },
    { source = "integrations/wezterm/md-open.lua", dest = "/usr/share/doc/mdmost/examples/wezterm/md-open.lua", mode = "644", doc = true },
    { source = "integrations/kitty/open-actions.conf", dest = "/usr/share/doc/mdmost/examples/kitty/open-actions.conf", mode = "644", doc = true },
]

# DEVELOPMENT ONLY, AND 0.3.0 DOES NOT SHIP WHILE THIS BLOCK IS HERE.
#
# `pulldown-latex` 0.8.0 has three defects we hit. Two abort the whole process with a
# stack overflow -- not a panic, so `catch_unwind` never sees it -- on unbounded parser
# recursion: an unbraced control-sequence argument chain (`\sqrt\sqrt...x`), and a run
# of tokens that emit no event (`\relax`, `%` comments). The third loses the extent of
# an unbraced optional argument, so `\sqrt[n+1]{x}` draws as the nth root, plus one.
#
# All three are fixed on the fork, on three independent branches off upstream main,
# merged into `mdmost-integration`:
#
#   fix/argument-recursion-depth   6e10f81   a depth counter in handle_primitive
#   fix/next-tail-recursion        49effe3   Parser::next and lex::token driven by a
#                                            loop instead of recursion
#   fix/optional-argument-extent   357ce1d   the radical index emitted as a group
#
# A patch section applies to local builds only, and crates.io refuses a git dependency
# outright, so this cannot be published. RULING (owner, 2026-08-22): 0.3.0 waits for an
# upstream release carrying these fixes, rather than shipping a product that differs
# from what CI builds, or publishing a renamed fork of someone else's crate. Retire this
# block, and the `rev`, the moment that release exists; the dependency then goes back to
# a plain version requirement.
#
# The third fix CHANGES RENDERED OUTPUT, so this pin is load-bearing for the test suite:
# `src/math/build.rs`'s `\sqrt[n+1]{x}` assertion holds only with it. That is why the pin
# and the release ruling are one decision.
#
# `MAX_COMMAND_RUN` and `MAX_SOURCE_BYTES` in `src/math/build.rs` stay regardless. They
# refuse before the parser runs, so they do not depend on which parser is underneath.
[patch.crates-io]
pulldown-latex = { git = "https://github.com/oetiker/pulldown-latex", rev = "e48d7e763e7b2d9ef0ae99fc71a5525f91052444" }
