[package]
name = "mdmost"
version = "0.1.0"
edition = "2024"
description = "A full-screen terminal pager for a single Markdown document"
license = "MIT"
repository = "https://github.com/oetiker/mdmost"
readme = "README.md"
keywords = ["markdown", "pager", "terminal", "tui", "mermaid"]
categories = ["command-line-utilities", "text-processing"]
# The demo recording and the design docs are for readers of the repository, not for
# anyone building the crate, and the `.webp` is the largest file in the tree.
exclude = ["docs/**", "demo/**", "tests/corpus/**", "tests/snapshots/**"]

[lib]
name = "mdmost"
path = "src/lib.rs"

[[bin]]
name = "mdmost"
path = "src/main.rs"

[features]
default = ["clipboard"]
# The local display server's clipboard, as the belt-and-braces second half of a copy
# (`src/tui/clipboard.rs`). OSC 52 is written unconditionally and needs no dependency;
# this is what lets the status bar say "copied" instead of "sent", and it is what makes
# a copy work on a terminal that refuses OSC 52. Optional because it links against
# X11/Wayland, which is not something to force on a build for a headless box: without
# it the pager still copies, it simply cannot confirm it.
clipboard = ["dep:arboard"]

[dependencies]
anyhow = "1.0.104"
# `default-features = false` drops `image-data`, which would pull in the whole `image`
# crate to support copying bitmaps — this copies text. `wayland-data-control` is asked
# for explicitly so a Wayland session is not silently served by XWayland alone.
arboard = { version = "3.6.1", default-features = false, features = [
    "wayland-data-control",
], optional = true }
clap = { version = "4.6.6", features = ["derive"] }
compact_str = "0.10.0"
comrak = { version = "0.54.0", default-features = false }
# Kept in lock step with the crossterm version ratatui 0.30 depends on.
crossterm = "0.29.0"
directories = "6.0.0"
# Not for logging anything of our own — `mdmost` has a status bar. This is the receiving
# end: `src/tui/stderr.rs` installs a logger so that a dependency's `warn!` is held back
# instead of being painted over the alternate screen. Already in the tree under
# `arboard`, which picks between `eprintln!` and `log::warn!` at run time and so has to
# be caught on both.
log = "0.4.33"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
signal-hook = "0.4.4"
# `default-fancy` swaps oniguruma for the pure-Rust `fancy-regex` engine, so the build
# needs no C toolchain. Same syntaxes, same themes, same API.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.20"
toml = "1.1.4"
# The syntax definitions `bat` curates — 213 of them against syntect's 2016-vintage 75,
# which had no TypeScript, Kotlin, Swift, Zig, Nix or even TOML. Roughly +0.6 MiB in the
# binary. `default-features = false` is load-bearing: the default feature is
# `syntect-onig`, which would drag oniguruma and a C toolchain into the build; the crate
# ships a separate dump built for `fancy-regex`, and `syntect-fancy` is the one that has
# to match syntect's `default-fancy` above. The definitions `fancy-regex` cannot compile
# (PowerShell, ARM assembly) are absent from that dump by design and fall back to plain
# text — README and design spec §8 say so.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# Two jobs, both of which would otherwise need `unsafe` in a crate that forbids it:
#
# * `event` — the event loop watches its own terminal descriptor for a hangup with
#   `poll`, the same `poll` crossterm itself is built on. Used on Linux only: `poll` on
#   `/dev/tty` is documented not to work on macOS, and answering "your terminal is gone"
#   wrongly would be worse than the spin it prevents.
# * `stdio` — `dup`/`dup2` on descriptor 2, so that a library writing to standard error
#   cannot scribble on the alternate screen (`src/tui/stderr.rs`). That one is wanted on
#   every unix, which is why the dependency is no longer Linux-only.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event", "stdio"] }

[dev-dependencies]
insta = "1.48.0"
# `tests/pty_hangup.rs` builds a real pty and destroys it; that is raw `openpty`,
# `setsid` and `TIOCSCTTY` territory, which is fine in a test crate.
libc = "0.2.189"
portable-pty = "0.9.0"
pretty_assertions = "1.4.1"
proptest = "1.11.0"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[package.metadata.deb]
maintainer = "Tobias Oetiker <tobi@oetiker.ch>"
copyright = "2026, Tobias Oetiker <tobi@oetiker.ch>"
license-file = ["LICENSE", "0"]
extended-description = """\
A full-screen terminal pager for a single Markdown document. Tables get real \
borders and negotiated column widths, fenced code is syntax-highlighted, and \
Mermaid diagrams are laid out as box art rather than shown as source. Rendering \
is a pure function of the document, width, theme and options, so a resize \
reflows everything. A single static binary."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/mdmost", "usr/bin/", "755"],
    ["man/mdmost.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/mdmost/README.md", "644"],
    ["LICENSE", "usr/share/doc/mdmost/LICENSE", "644"],
]

[package.metadata.generate-rpm]
summary = "Full-screen terminal pager for a single Markdown document"
license = "MIT"
# The musl builds are statically linked, so there is nothing to depend on — and the
# host's find-requires cannot inspect a cross-built aarch64 binary anyway.
auto-req = "no"
assets = [
    { source = "target/release/mdmost", dest = "/usr/bin/mdmost", mode = "755" },
    { source = "man/mdmost.1", dest = "/usr/share/man/man1/mdmost.1", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/mdmost/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/mdmost/LICENSE", mode = "644", doc = true },
]
