# The tmux the demo is recorded inside. Loaded with `-f`, so the maintainer's own
# ~/.tmux.conf never reaches the recording.

set -g mouse on

# The whole point of act 4: mdmost writes OSC 52 unconditionally, tmux consumes it
# into its own paste buffer, and `prefix ]` pastes it into the nano pane. No display
# server is involved anywhere on that path.
set -g set-clipboard on

# No tmux status line: all thirty rows belong to the two programs being compared.
set -g status off

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
