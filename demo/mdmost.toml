# The recording script for the README demo. Run from the repository root:
#
#     ansidrama record demo/mdmost.toml
#
# ansidrama drives the launch command in an embedded terminal and captures one frame
# per key, per typed character and per mouse cell-step. `out` is resolved relative to
# *this file's* directory, which is why it climbs one level.

cols = 100
rows = 30

# The frame is 100x30 cells, so the font is what decides the pixel size of a README
# hero image. 15px keeps the two panes legible at 1:1 without a 1200px-wide picture.
font_px = 15
card_font_px = 40
max_fps = 30
type_cs = 5
move_cs = 2

# tmux has to start, then `bash` and `mdmost` inside it. A short floor here races the
# first prompt and the demo types into nothing.
startup_ms = 2500

# `q` quits mdmost, which is the last process standing, which ends the tmux session.
quit_keys = ["q"]

out = "../docs/demo/mdmost.webp"

# DISPLAY and WAYLAND_DISPLAY are emptied on purpose. mdmost writes OSC 52
# unconditionally, but with a reachable display server `arboard` *also* takes the copy
# and the status bar says something different. Pinning them empty is what makes two
# maintainers' recordings identical. LESS and the nano rc files are pinned for the same
# reason — the left pane must not inherit the recording host's taste.
env = { COLORTERM = "truecolor", DISPLAY = "", WAYLAND_DISPLAY = "", LESS = "", LESSOPEN = "", LESSCLOSE = "" }

# A private tmux socket (`-L mdmost-demo`), so the recording can never join, resize or
# outlive a tmux server the maintainer is sitting in. `-f demo/tmux.conf` keeps their
# ~/.tmux.conf out of it. Pane 0 is a *shell*, not `less` directly: that is what lets
# act 4 replace `less` with `nano` by typing, and act 5 close the pane with `exit`,
# without a single tmux command-mode keystroke.
#
# `PS1='$ '` is a prefix on the pane's own command rather than an entry in `env` above:
# an exported PS1 is reassigned by the recording host's /etc/profile inside the outer
# login shell, and the pane then inherits *that* prompt instead of this one.
launch = '''tmux -L mdmost-demo -f demo/tmux.conf new-session -s demo -x 100 -y 30 "PS1='$ ' bash --norc --noprofile -i" \; split-window -h -t demo "${CARGO_TARGET_DIR:-target}/release/mdmost --mouse --config demo/config.toml demo/tour.md"'''

# The hero image is dressed as a window, so a reader meeting it on the README knows at a
# glance that they are looking at a terminal and not a web app. The bar is keyed to the
# dark theme's own background (`#11141b`, `src/theme/builtin.rs`) one step lighter, and
# the title text to a muted form of its foreground — not ansidrama's greys, which sit
# beside this palette rather than in it.
#
# The bar is fixed, and would be even if the tour changed theme again: a title bar that
# changed colour mid-tour would read as a second window opening. Dark is the theme the
# tour opens and closes in, and the card and the closing frame — the two frames a looping
# viewer lands on — are both dark.
[chrome]
style = "macos"
title = "mdmost — demo/tour.md"
padding = 14
bar = "#1c212c"
text = "#8d95a8"

# ─── Act 1: the split ────────────────────────────────────────────────────────────
# `less` on the left, `mdmost` on the right, the same file in both.

# The opening card holds three times the length of an ordinary beat, and so does the
# closing one at the foot of this file. The demo loops, so those two are the only frames
# a viewer arriving mid-play can orient on, and at the old 260 the card was gone before
# the second line had been read.
[[scene]]
card = { lines = ["mdmost", "like less but for Markdown"], fg = "#fef9c3" }
hold_cs = 300

[[scene]]
click = { x = 20, y = 25 }
hold_cs = 30

[[scene]]
text = "less demo/tour.md"
hold_cs = 40

[[scene]]
keys = ["Enter"]
await = { find = "demo/tour.md", row = -1 }
hold_cs = 260

# ─── Act 2: the drags ────────────────────────────────────────────────────────────
# The divider sits at column 51 and mdmost is the RIGHT pane, so the divider moves
# LEFT to widen it: 49 columns become 64. The table's cells go from two lines to one,
# the flowchart's node labels stop wrapping, and the prose merely re-breaks. One
# motion, three behaviours — while `less` re-wraps into different mush.

[[scene]]
click = { x = 76, y = 30 }
hold_cs = 30

[[scene]]
keys = ["Space"]
hold_cs = 160

# `await` is a regex (ansidrama `Pattern::new` -> `Regex::new`), not a literal
# substring. mdmost's rendered table borders cells with U+2502 ("│"); the raw
# Markdown at demo/tour.md:20 borders them with an ASCII pipe ("|", U+007C) —
# a different codepoint. A pattern that requires the *rendered* glyph between
# these two cells can therefore only ever come from mdmost's own drawing, not
# from less showing the source, however less happens to wrap the line. That's
# the anchor here — not a width margin (a plain substring match on "Steady
# since dawn, unusual" alone only worked because the source line is one
# character longer than the undragged pane is wide, and would silently stop
# proving anything if `Barometer`/`1013 hPa` were ever shortened).
[[scene]]
drag = { from = [51, 15], to = [37, 15] }
await = "hPa +│ +Steady since dawn, unusual"
hold_cs = 200

[[scene]]
drag = { from = [37, 15], to = [51, 15] }
hold_cs = 160

[[scene]]
drag = { from = [51, 15], to = [37, 15] }
await = "hPa +│ +Steady since dawn, unusual"
hold_cs = 200

[[scene]]
drag = { from = [37, 15], to = [51, 15] }
hold_cs = 200

# ─── Act 3: scrolling what cannot reflow ─────────────────────────────────────────
# The five-column table needs sixty columns and the pane has forty-nine. `Right`
# moves the table and nothing else: the prose above it does not stir, and the `↔`
# readout counts the columns still off the edge. `g` comes back to the top left.

[[scene]]
keys = ["Space"]
hold_cs = 200

[[scene]]
keys = ["Right", "Right", "Right", "Right", "Right", "Right"]
type_cs = 14
await = { find = "↔ 14/14", row = -1 }
hold_cs = 240

[[scene]]
keys = ["g"]
hold_cs = 160

# ─── Act 4: copy, into the other pane ────────────────────────────────────────────
# `less` gives way to `nano`, and three copies cross the split. mdmost writes OSC 52,
# tmux takes it into its own paste buffer, `prefix ]` pastes it next door. A table
# arrives as TSV, a fenced block as its own source, a dragged paragraph as Markdown.

[[scene]]
click = { x = 20, y = 25 }
hold_cs = 30

[[scene]]
keys = ["q"]
hold_cs = 120

[[scene]]
text = "nano -I /tmp/pasted.txt"
hold_cs = 40

[[scene]]
keys = ["Enter"]
hold_cs = 200

# The table's `[copy]` button — tab-separated values.
[[scene]]
click = { x = 76, y = 30 }
hold_cs = 30

[[scene]]
keys = ["Space"]
hold_cs = 140

[[scene]]
click = { x = 93, y = 2 }
hold_cs = 220

[[scene]]
click = { x = 20, y = 25 }
hold_cs = 30

# The status bar's copy notice is not available as a gate here — at 49 columns it drops
# to fit (Task 3) — so this waits for the paste to land in `nano` instead. Row-scoped
# matching runs the regex against `grid[idx].trim_end()` alone (`ansidrama/src/pattern.rs`)
# — no other row's text is in the haystack — so `^` (no `(?m)`, `regex_lite`) anchors to
# offset 0 of *that one row*, which is column 1 of the frame. mdmost is the right pane and
# never draws anything before roughly column 51, so a `^`-anchored pattern can only ever
# match nano's half of the row: it is incapable of matching mdmost's own rendering,
# regardless of what mdmost is showing or where it is scrolled. The text itself is
# tab-expanded TSV spacing ("Instrument      Reading Remark") that only the paste
# produces — mdmost always separates cells with U+2502 ("│"), never plain spaces
# (`export::table_tsv`, `render::table` — the same discriminator as act 2's drag, read in
# the opposite direction), which is a second, independent reason this could never be
# mdmost's own text even without the anchor.
[[scene]]
keys = ["C-b", "]"]
await = { find = '^Instrument +Reading +Remark', row = 1 }
hold_cs = 260

# The fenced block's `[copy]` button — the Rust source that was written, not the
# coloured cells that were drawn.
#
# Four pages down from the top puts the frame's top edge on row 1 of the pane, which is
# where its button is. It used to be row 16, and the row is the fragile half of this
# coordinate: the column is pinned to the frame's right edge and has not moved, but the
# row is wherever four `Space` presses happen to land the block, and that is a function
# of everything the renderer does above it. A miss here is silent — the click lands on
# document text, copies nothing, and the `prefix ]` two scenes later pastes the previous
# buffer a second time. So: after any change to the renderer or to `demo/tour.md`, put a
# 49-column pane on the file, press `Space` four times, and read the row off the screen
# before believing this number.
[[scene]]
click = { x = 76, y = 30 }
hold_cs = 30

[[scene]]
keys = ["Space", "Space", "Space"]
hold_cs = 140

[[scene]]
click = { x = 94, y = 1 }
hold_cs = 220

[[scene]]
click = { x = 20, y = 25 }
hold_cs = 30

# The pasted Rust source lands on nano's row 5, its first line — verified live, the same
# way the frame's row 1 above was. The same literal text (syntax colour doesn't change
# characters) sits on mdmost's row 5 too, boxed at `[copy]` (94, 1) behind the frame's
# left border and a padding column, so this cannot lean on "mdmost's half of this row
# happens to be blank" the way paste 1 above can — it isn't, and a positional argument
# like that would only hold for as long as mdmost stays scrolled exactly here. `^`
# (row-scoped, so it anchors to column 1 of the frame — see the note on the first paste)
# fixes that by construction: mdmost is the right pane and never draws before roughly
# column 51, so `^fn reading...` can only match nano's flush-left copy, never mdmost's
# framed one, wherever mdmost happens to be scrolled.
[[scene]]
keys = ["C-b", "]"]
await = { find = '^fn reading\(s: &Sample\) -> Option<Reading> \{', row = 5 }
hold_cs = 260

# A dragged paragraph — the Markdown behind the cells, not the cells.
[[scene]]
click = { x = 76, y = 30 }
hold_cs = 30

[[scene]]
keys = ["g"]
hold_cs = 120

[[scene]]
drag = { from = [53, 7], to = [97, 11] }
hold_cs = 240

[[scene]]
click = { x = 20, y = 25 }
hold_cs = 30

# This is the largest of the three pastes and the one a deleted 0.2.0 workaround (a
# trailing `keys = []` re-capture scene) used to protect — nano used to redraw it in
# more than one write, and a single capture could freeze the pane one paste short of
# the truth. Continuous sampling (the `moved`/`held` wait in `sampler.rs`) now stands in
# for that: this `await` cannot be satisfied until the screen has gone quiet, so a paste
# still arriving in a second write keeps the wait open rather than letting a stale frame
# slip through. Row 12 is the paragraph's first line, landing right after the fenced
# block's closing `}` on row 11, flush at column 1 in nano — verified live, not assumed.
# `^` anchors there for the same structural reason as the two pastes above: row-scoped
# matching leaves only that one row's text in the haystack, so offset 0 is column 1 of
# the frame, which is nano's ground and never mdmost's, independent of whatever mdmost
# is showing on its own half of row 12 at this or any other scroll position.
[[scene]]
keys = ["C-b", "]"]
await = { find = '^A pager renders\. It does not merely print a', row = 12 }
hold_cs = 300

# ─── Act 5: full width ───────────────────────────────────────────────────────────
# The left pane closes and mdmost takes all hundred columns: the contents pane opens
# into the margin the body cap leaves, and the wide diagram finally draws and scrolls.

[[scene]]
keys = ["C-x"]
hold_cs = 140

[[scene]]
keys = ["n"]
hold_cs = 120

[[scene]]
text = "exit"
hold_cs = 40

# `bash` exits here, and for a moment a keystroke could reach a pane tmux has not yet
# closed. Row 4's rule under the banner only runs this long once mdmost holds all
# hundred columns, so the `await` cannot fire until the pane has actually closed.
# Recorded three times behind this gate and every time the `Tab`, the four `Down`s
# and the `Enter` landed on mdmost — the wait survives the pane transition. Should a
# future recording still race it, the `await` is what turns that into a loud abort
# instead of a silently wrong demo.
[[scene]]
keys = ["Enter"]
await = { find = '^\s*━{55,}', row = 4 }
hold_cs = 300

[[scene]]
keys = ["Tab"]
hold_cs = 240

[[scene]]
keys = ["Down", "Down", "Down", "Down"]
type_cs = 16
hold_cs = 180

[[scene]]
keys = ["Enter"]
hold_cs = 200

[[scene]]
keys = ["Tab"]
hold_cs = 180

[[scene]]
keys = ["Right", "Right", "Right", "Right", "Right", "Right", "Right", "Right"]
type_cs = 12
hold_cs = 280

[[scene]]
keys = ["g"]
hold_cs = 140

# ─── Act 6: a link, a footnote, and then no mouse at all ─────────────────────────
# The search is the lift to the last section, and it is still the search beat: the
# match lands centred, which puts the three controls of that section — an `http` link,
# a `#heading` reference and a footnote marker — on rows 19, 22 and 24 of a hundred-
# column frame. Every coordinate below is read off that layout, so a change to
# `demo/tour.md` above this section moves all of them.
[[scene]]
keys = ["/"]
hold_cs = 100

[[scene]]
text = "Where a link"
hold_cs = 60

[[scene]]
keys = ["Enter"]
hold_cs = 220

# The pointer glides to the link and rests on it. ansidrama >=0.4.0 reports its motion
# to an application in any-event tracking, which mdmost is (`src/tui/term.rs:249`), so
# the link lights and the status bar names its host with a real arrow on screen.
[[scene]]
move = { x = 12, y = 19 }
await = { find = "github.com", row = -1 }
hold_cs = 240

# The pointer moves off the link to the footnote marker. Without this the URL would
# stand in the status bar for the rest of the recording, over a footnote it has
# nothing to do with — and this is genuinely load-bearing, not tidiness: only
# `MouseEventKind::Moved` calls `set_pointer`/`clear_pointer` (`src/tui/term.rs`), so a
# click alone would never clear a stuck hover.
#
# The `await` proves the URL actually left. It cannot look for the URL's absence —
# `await` waits for text to appear — so instead it waits for what the URL's presence
# is proven to *displace*: the status bar's heading breadcrumb ("Source, kept", the
# `##` heading above this point in `demo/tour.md`) is the cheapest segment on the bar
# (`Drop::Context` in `src/tui/chrome.rs`) and is dropped first whenever the bar runs
# out of width. Verified live at this pane's 100 columns: with the link hovered, the
# breadcrumb is absent (the URL takes its place); the instant the pointer leaves, the
# breadcrumb reappears. So its presence, row-scoped to the status bar, is proof the
# URL is gone.
#
# This is the gate's load-bearing assumption, not an incidental detail: it depends on
# `Drop::Url` and `Drop::Context` contending for the same width, so if the status bar is
# ever changed to stop dropping the breadcrumb first — or to show both segments at once —
# this `await` starts matching a screen that still has the URL on it, and the gate goes
# decorative silently. That is exactly the failure mode this re-think exists to catch, so
# a status-bar change is a reason to re-verify this gate by eye, not just re-run it.
[[scene]]
move = { x = 28, y = 24 }
await = { find = "Source, kept", row = -1 }
hold_cs = 60

# The note opens in a box *above* its marker — twelve rows will not fit in the five
# below it — and the page behind it does not move.
[[scene]]
click = { x = 28, y = 24 }
await = "↓ 8 more"
hold_cs = 300

# `↓ 8 more` in the box's bottom edge, and the cursor keys spend themselves on the note
# rather than on the document. Scrolling the document would dismiss the note, so this
# is the only reading of `Down` that could be right. The counter walks 8 → 7 → 6 → 5 while
# the document stays at 75%.
[[scene]]
keys = ["Down", "Down", "Down"]
type_cs = 22
hold_cs = 240

# Dismissed by a click outside the box, **not** by `Esc`: `hold_cs` is a duration written
# into the WebP, not a sleep. ansidrama sends the next scene's key as soon as the terminal settles, so an
# `Escape` scene lays an ESC byte a few milliseconds in front of the next keystroke and
# mdmost reads the pair as `M-F`. Recorded that way once, and the note stayed up for the
# rest of the take: the swallowed `F` cost the walk below its first step, and `enter`
# landed back on the marker it had never left. A click outside is what design spec §6
# gives for dismissal in any case, and it takes the pointer somewhere the eye can
# follow. (90, 6) is blank canvas to the right of the code frame, well clear of both
# the box and any control.
[[scene]]
move = { x = 90, y = 6 }
hold_cs = 40

[[scene]]
click = { x = 90, y = 6 }
hold_cs = 200

# No mouse from here. `F` walks backwards from the end of the document, which is where
# these three controls are: one press lights the marker, the second the `#reading-room`
# reference, and `enter` follows it — the heading comes to the top of the viewport and
# nothing has left the document. Backwards rather than forwards because these three are
# the last controls in the file and one press reaches them; `f` would set out from the
# first `[copy]` button ten screens above and scroll the whole document back down again
# to get here. (It *would* get here: the cursor scrolls its target into view as of
# `4fea1ee`. Before that it did not, and the first four `f` presses lit nothing a viewer
# could see — which is why this walk was written backwards in the first place.)
#
# Three back, one forward, and that is deliberate. The walk *could* stop at the second
# press, on the anchor `enter` is about to follow — but only a link carries a URL, and the
# status bar's URL segment is the safeguard design spec §8 puts in place of an "are you
# sure" prompt. A footnote marker and an anchor both show nothing there, correctly, so a
# walk that touched only those two would never once show a mouseless reader where a
# control leads. The third `F` reaches `the project page` and the bar names the host with
# no pointer anywhere on screen — which is the whole of what `4fea1ee` added, and what the
# paragraph on screen has been claiming since act 6 was written.
#
# Then `f` steps forward, back onto the anchor. It also makes the point that the walk goes
# both ways, and it is why `enter` below still follows `#reading-room` rather than opening
# a browser — which, with `DISPLAY` emptied for act 4, would put a launch failure in the
# status bar as the tour's closing note.
[[scene]]
keys = ["F"]
hold_cs = 200

[[scene]]
keys = ["F"]
hold_cs = 220

[[scene]]
keys = ["F"]
await = { find = "github.com", row = -1 }
hold_cs = 300

[[scene]]
keys = ["f"]
hold_cs = 240

# This is the tour's closing note, so its outcome is gated rather than trusted: with
# `DISPLAY` emptied for act 4, a swallowed `f` above would leave `enter` on whatever
# the walk last landed on, and following an `Open` hotspot instead of an anchor would
# put a launch failure in the status bar as the last thing a looping viewer reads.
# `Reading room` is safe unscoped-looking but is not unscoped: the same words already
# sit in the paragraph above ("Reading room (#reading-room), scrolls there instead of
# leaving"), so this is row-scoped to the status bar's heading breadcrumb, which reads
# a different heading ("Source, kept") right up until this `enter` actually lands —
# verified live: the breadcrumb only becomes `Reading room` once the heading is
# genuinely scrolled to the top of the viewport.
[[scene]]
keys = ["Enter"]
await = { find = "Reading room", row = -1 }
hold_cs = 280

# ─── Act 7: the closing panel ────────────────────────────────────────────────────
# The theme beat: `t` to light, `t` back to dark. It was cut on 2026-08-13 because the
# first `t`, at this exact point in the tour — right after act 6's keyboard walk, `F F F
# f Enter` — recorded a frame that was still the *dark* screen captioned `theme: light`,
# held for 2.8 seconds. A status bar that names a theme the screen is not wearing is the
# one thing this project says a status bar may never do, and it is worse on the hero
# image than on any other screen.
#
# It was never mdmost: a live pane repaints correctly every time, and so does ansidrama
# recording the same switch in isolation or under tmux. The bisect (table in
# `docs/maintainer-notes.md`) pinned the trigger to act 6's keyboard walk immediately
# before the `t` — truncate the script before it, or pad past it, or replace the walk
# with a plain `G`, and the switch records correctly every time.
#
# ansidrama 0.3.0 fixed the likely cause: output still draining from a previous input
# could end the current input's wait early, so the capture landed before the repaint.
# The grace is now measured on real grid changes rather than PTY bytes, which is exactly
# the class of race the bisect pointed at.
#
# The `await` below is necessary and NOT sufficient. The broken frame carried a
# *correct* caption over a *wrong* colour, and `await` matches text, never colour — it
# would have matched the broken frame just as happily as a fixed one. So the light frame
# is not trusted on the `await`'s word: every recording of this beat is opened as a PNG
# and its background is read by eye against the theme's real colours (`#fdfcf9` for
# light, `#11141b` for dark, `src/theme/builtin.rs`) before this beat is believed fixed.
# That check against 0.4.0 is recorded as a second entry in the bisect table.
[[scene]]
keys = ["t"]
await = { find = "theme: light", row = -1 }
hold_cs = 280

[[scene]]
keys = ["t"]
await = { find = "theme: dark", row = -1 }
hold_cs = 280

# The tour closes on the theme it opened in. The document is where `enter` left it —
# `Reading room` at the top of the viewport, which is the last thing act 6 proved a
# keyboard can reach — and that frame is held three times over for the same reason as
# the opening card: it is where a looping viewer lands.
[[scene]]
keys = []
hold_cs = 900
