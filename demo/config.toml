# mdmost's own configuration for the recorded demo.
#
# Passed with `--config demo/config.toml` so the recording never inherits the
# maintainer's `~/.config/mdmost/config.toml`. Every key that could otherwise be
# decided by the host is pinned here, because a demo that renders differently on
# two machines cannot be re-recorded.

theme = "dark"

# Nerd Font glyphs are otherwise *detected*, and the answer would then depend on which
# fonts the recording host has installed. Pinned ON rather than left to detection: the
# recording is rasterised by ansidrama, which bundles Symbols Nerd Font for exactly these
# codepoints and consults it after its text font, so the glyphs are there on every host.
#
# This was pinned OFF until 2026-08-13 on the grounds that ansidrama rasterised with
# "JetBrains Mono, which has no Nerd Font glyphs" — a claim about someone else's bundled
# font that stopped being true when they added two more, and which nothing here would
# ever have re-checked. Needs an ansidrama new enough to carry the symbols font.
icons = true

# The title banner is opt-in and off by default, so the demo has to ask for it.
title_banner = true

line_numbers = false
section_numbers = true
scroll_step = 3

# The prose cap. At the 100 columns of act 5 this is what keeps the paragraphs
# readable instead of running the whole width of the frame.
body_width = 72

[toc]
open = false
width = 28
