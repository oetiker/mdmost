name: CI (mdmost's own jobs)

# Called by ci.yml's ci-local job (repo-infra D25); never triggered on its own.
on:
  workflow_call:
    # Create release PR runs ci.yml on the release branch and passes it here
    # (repo-infra D28); on push and pull_request it is empty and checkout uses
    # its default commit.
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  one-syntect:
    name: One syntect only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `[patch.crates-io]` is ignored in silence if the vendored version stops satisfying
      # two-face's requirement. Two syntect crates compile and the failure surfaces as a
      # type error naming `SyntaxSet` twice.
      - name: One syntect only
        run: cargo tree -p syntect --quiet

  syntect:
    name: Vendored syntect tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # syntect's own tests need real Sublime Text package and theme content that
      # upstream's own repo pulls from four git submodules, none of which vendor/syntect
      # carries (see vendor/syntect/VENDORED.md for why: ~20 MB of independently-licensed,
      # actively-changing third-party content, going into a directory the vendoring's own
      # exit plan deletes within a year). Seven of the tests that need it are in
      # `parsing::parser::tests` -- the exact file both syntect patches modify -- so
      # living with a skip list here would leave the two patches' most important
      # regression net unexercised. Instead: fetch each submodule at the exact commit
      # `v5.3.0`'s own tree pins it to (never a branch -- a branch moves), straight from
      # upstream, with nothing kept or redistributed by this repository. If any fetch
      # fails, this step fails and stays failed -- no silent fallback to the skip list.
      - name: Fetch syntect's test fixtures (not vendored, not redistributed)
        run: |
          set -eu
          cd vendor/syntect/testdata
          fetch() {
            name="$1"; url="$2"; sha="$3"
            mkdir "$name"
            cd "$name"
            git init -q
            git fetch --depth 1 "$url" "$sha"
            git checkout -q FETCH_HEAD
            rm -rf .git
            cd ..
          }
          fetch Packages https://github.com/sublimehq/Packages fa6b8629c95041bf262d4c1dab95c456a0530122
          fetch Solarized https://github.com/braver/Solarized.git bcd6234b4f5f96d3fd27db079268b5757053072a
          fetch spacegray https://github.com/kkga/spacegray.git 2703e93f559e212ef3895edd10d861a4383ce93d
          fetch InspiredGitHub.tmtheme https://github.com/sethlopezme/InspiredGitHub.tmtheme.git 18ddb271179e118cfc2dd83abf88b915b7328a25

      # The vendored syntect's own suite, for the same reason pulldown-latex's runs: the
      # patches in vendor/syntect/src/parsing/parser.rs add their regression tests to the
      # inline `mod tests` there. If these go red, a patch has been lost. No `--skip`
      # here -- the fixtures the step above fetched make the full 134 run (113 lib + 8
      # error_handling + 13 doctests; see vendor/syntect/VENDORED.md).
      - name: Run the vendored syntect's tests
        run: cargo test -p syntect

  windows:
    name: Windows compile
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A compile, not a run: nobody has exercised the pager on Windows. This leg
      # exists so the `cfg` gates in `tui::term` and `tui::stderr` stay honest.
      - name: Cargo check
        run: cargo check --all-targets -p mdmost
