name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - bugfix
          - feature
          - major

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify main branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases must be created from the main branch"
            exit 1
          fi

      - name: Calculate new version
        id: version
        run: |
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1 || echo "v0.0.0")
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          MAJOR=$(echo "$LATEST" | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1/')
          MINOR=$(echo "$LATEST" | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\2/')
          PATCH=$(echo "$LATEST" | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\3/')
          case "${{ inputs.release_type }}" in
            major)   NEW_VERSION="$((MAJOR+1)).0.0" ;;
            feature) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
            bugfix)  NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Update Cargo.toml version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

          # Cargo.lock records this package's own version too, so it has to move with
          # Cargo.toml. If it does not, the release commit is internally inconsistent:
          # dirty the moment anyone builds it, and fatal at `cargo publish`, which
          # re-resolves, rewrites Cargo.lock and then refuses to publish a dirty tree.
          #
          # Not `--offline`. This job checks out and edits Cargo.toml without ever
          # fetching the registry, so an offline resolve cannot find a single
          # dependency and dies with "no matching package named `anyhow` found".
          # `--workspace` keeps it to the workspace's own entry -- no dependency is
          # touched, which is what makes running it here safe.
          #
          # And no `|| true`. Swallowing the failure is what turned a broken step into
          # a broken release: v0.1.1 was tagged with Cargo.toml at 0.1.1 and
          # Cargo.lock still at 0.1.0, and the publish failed 6 minutes later.
          cargo update --workspace

          # Fail here rather than at the end of the run if the lock did not take.
          if ! grep -A1 '^name = "mdmost"$' Cargo.lock | grep -qx "version = \"${VERSION}\""; then
            echo "::error::Cargo.lock does not record version ${VERSION}"
            exit 1
          fi

      - name: Update CHANGES.md
        run: |
          DATE=$(date +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.version }}"
          # Move the `## Unreleased` block (everything up to the next `## <version>`
          # heading, or EOF) into a new `## <version> - <date>` section and reset
          # Unreleased to empty subsections. Block-boundary match, so blank lines
          # before ### Changed/### Fixed and a missing trailing version section are
          # both handled.
          perl -i -0777 -pe '
            s{^\#\# Unreleased\n(.*?)(?=\n\#\# |\z)}{
              "## Unreleased\n\n### New\n\n### Changed\n\n### Fixed\n\n" .
              "## '"$VERSION"' - '"$DATE"'\n$1"
            }gmse' CHANGES.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGES.md
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin main --tags

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            package: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            package: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            windows: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # man/ is not in git; it is generated from docs/manual.md. Three steps in this
      # job need the page — the tarball, the deb and the rpm — so it is built once
      # here, before any of them. The Windows zip ships no man page, so that leg
      # skips pandoc rather than installing something nothing uses.
      - name: Build the man page
        if: '!matrix.windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install pandoc
          else
            sudo apt-get update && sudo apt-get install -y pandoc
          fi
          make man
        shell: bash

      - name: Install cross
        if: matrix.cross
        # Pinned to the released version, not `main`: the static-musl build cannot be
        # rehearsed locally, so it must not rest on a moving dependency.
        run: cargo install cross --version 0.2.5 --locked

      - name: Build binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            RUSTFLAGS="-C target-feature=+crt-static" cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Create tarball
        if: '!matrix.windows'
        run: |
          mkdir -p dist staging/mdmost/man
          BINARY="target/${{ matrix.target }}/release/mdmost"
          ARCHIVE="mdmost-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          cp "$BINARY" staging/mdmost/
          cp man/mdmost.1 staging/mdmost/man/
          cp README.md LICENSE staging/mdmost/
          # The Homebrew formula installs integrations/ out of this tarball, so it has
          # to be in here; `brew install` never sees the repository.
          cp -R integrations staging/mdmost/
          tar -czvf "dist/${ARCHIVE}" -C staging mdmost
        shell: bash

      - name: Create zip (Windows)
        if: matrix.windows
        run: |
          mkdir dist
          mkdir staging/mdmost
          $ARCHIVE = "mdmost-${{ needs.version.outputs.version }}-${{ matrix.target }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/mdmost.exe" staging/mdmost/
          Copy-Item README.md staging/mdmost/
          Copy-Item LICENSE staging/mdmost/
          Compress-Archive -Path staging/mdmost -DestinationPath "dist/$ARCHIVE"
        shell: pwsh

      - name: Build deb and rpm
        if: matrix.package
        run: |
          cargo install cargo-deb --version '^3.7'
          cargo install cargo-generate-rpm --version '^0.21'
          cargo deb --no-build --no-strip --target ${{ matrix.target }}
          cargo generate-rpm --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb dist/
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdmost-${{ matrix.target }}
          path: dist/*

  create-release:
    name: Create GitHub Release
    needs: [version, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: mdmost-*
          merge-multiple: true

      - name: Extract release notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Print this version's section up to the next `## <version>` heading. Drop
          # that trailing heading, but only if the last printed line IS one: for the
          # final section in the file the range runs to EOF, where a blind `$d` would
          # delete real content.
          sed -n "/^## ${VERSION}/,/^## [0-9]/p" CHANGES.md | sed '${/^## [0-9]/d}' > release-notes.md
          echo "Release notes:"; cat release-notes.md

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: mdmost ${{ needs.version.outputs.tag }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  publish-crate:
    name: Publish to crates.io
    needs: [version, create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        # `--locked` publishes exactly what the tag locked, and turns a stale
        # Cargo.lock into an error that names the lock rather than into the puzzling
        # "working directory contains changes that were not yet committed" that comes
        # from cargo silently rewriting it first.
        #
        # The token goes through the environment because `--token` is deprecated.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked

  homebrew:
    name: Update Homebrew formula
    needs: [version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The formula is committed to `main`, not to the tag: a tap is read from the
      # default branch. It runs after create-release because it checksums artifacts
      # that must already exist.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download tarballs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: mdmost-*
          merge-multiple: true

      - name: Rewrite the formula
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          sha() { sha256sum "artifacts/mdmost-${VERSION}-$1.tar.gz" | cut -d' ' -f1; }
          MAC_ARM=$(sha aarch64-apple-darwin)
          MAC_X86=$(sha x86_64-apple-darwin)
          LINUX_X86=$(sha x86_64-unknown-linux-musl)
          LINUX_ARM=$(sha aarch64-unknown-linux-musl)
          # Each sha256 line carries a trailing marker comment naming the artifact it
          # belongs to, which is what makes this rewrite unambiguous.
          sed -i \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s|sha256 \"[0-9a-f]*\" # mac-arm|sha256 \"${MAC_ARM}\" # mac-arm|" \
            -e "s|sha256 \"[0-9a-f]*\" # mac-x86|sha256 \"${MAC_X86}\" # mac-x86|" \
            -e "s|sha256 \"[0-9a-f]*\" # linux-x86|sha256 \"${LINUX_X86}\" # linux-x86|" \
            -e "s|sha256 \"[0-9a-f]*\" # linux-arm|sha256 \"${LINUX_ARM}\" # linux-arm|" \
            Formula/mdmost.rb
          cat Formula/mdmost.rb

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mdmost.rb
          git commit -m "Homebrew formula for ${{ needs.version.outputs.tag }}"
          git push origin main

  # Nothing here is compiled, but a formula with no bottle is a *source build* as far as
  # Homebrew is concerned, and a source build refuses to run on a Mac whose Command Line
  # Tools are older than its macOS. Bottling is how that check is skipped.
  #
  # This runs after `homebrew` on purpose: it installs the formula from the tap, so the
  # version and the sha256 lines that job pushed have to be on `main` first.
  bottles:
    name: Bottle on ${{ matrix.os }}
    needs: [version, homebrew]
    runs-on: ${{ matrix.os }}
    # Only the leg that is expected to rot is allowed to fail quietly. A missing Intel
    # bottle is a slow install for Intel Macs; a broken arm64 bottle is a real defect and
    # fails the release.
    #
    # `continue-on-error` covers a leg that *runs* and fails. It does nothing for a leg
    # that never starts, and that is the failure these labels actually have: a retired
    # image leaves the job **queued** with no runner for the 24 hours GitHub waits before
    # cancelling it, `publish-bottles` never fans in, and the bottle the other leg built
    # in half a minute is left in an artifact nobody collects. That is what happened to
    # v0.1.2, which shipped with an empty bottle block. Nothing in the workflow can catch
    # it — `timeout-minutes` bounds run time, not queue time — so the labels below have
    # to be kept current by hand, and a release that sits in `queued` is the symptom.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest image per architecture, because Homebrew's fallback lets a bottle
          # serve *newer* macOS and never older.
          #
          # macos-14 is arm64 and is now deprecated; it still schedules, and moving up to
          # macos-15 would narrow the bottle to Sequoia and later, so it stays until it
          # stops working. macos-15-intel is the last x86_64 image GitHub will ever
          # offer — a standard runner, not a paid larger one — and it goes away in August
          # 2027 along with Intel support altogether. Being macOS 15, its bottle serves
          # Sequoia and later only: an Intel Mac on Ventura or Sonoma gets the source
          # path, and there is no older Intel runner left to change that. It is the
          # optional leg for that reason.
          - os: macos-14
          - os: macos-15-intel
            optional: true
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Tap and trust
        # Homebrew 6.0 stopped loading formulae from third-party taps until they are
        # trusted. `brew trust` does not exist before that, and the `||` keeps this
        # working on a runner image that is still on Homebrew 5.
        run: |
          brew tap oetiker/mdmost https://github.com/oetiker/mdmost
          brew trust --formula oetiker/mdmost/mdmost || true

      - name: Build the bottle
        # `--build-bottle` also downloads and checksums the release tarball, so this is
        # an end-to-end test of the artifacts `create-release` published.
        run: |
          brew install --build-bottle oetiker/mdmost/mdmost
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/oetiker/mdmost/releases/download/${{ needs.version.outputs.tag }}" \
            oetiker/mdmost/mdmost
          ls -la ./*.bottle.*

      - name: Upload bottle
        uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: |
            ./*.bottle.tar.gz
            ./*.bottle.json

  publish-bottles:
    name: Publish bottles
    needs: [version, bottles]
    # A skipped or failed `bottles` leg would otherwise skip this job too, and one
    # architecture is worth publishing on its own. The steps below handle finding no
    # bottles at all.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download bottles
        uses: actions/download-artifact@v8
        with:
          path: bottles
          pattern: bottle-*
          merge-multiple: true

      - name: Upload bottles to the release
        # `brew bottle` writes `name--version.tag.bottle.tar.gz`, with two dashes, which
        # is the name GitHub Packages wants. A plain `root_url` like ours is fetched as
        # `name-version.tag.bottle.tar.gz`, with one — see `Bottle::Filename#url_encode`
        # against `#github_packages` in Homebrew. The json carries both names, so the
        # rename is read from it rather than guessed at.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          jsons=(bottles/*.bottle.json)
          if [ ${#jsons[@]} -eq 0 ]; then
            echo "::warning::no bottles were built; the formula keeps an empty bottle block"
            exit 0
          fi
          for json in "${jsons[@]}"; do
            # One tag per runner in practice, but read them all rather than assume it.
            jq -r '.[].bottle.tags[] | "\(.local_filename)\t\(.filename)"' "$json" \
            | while IFS=$'\t' read -r local_name upload_name; do
                mv "bottles/${local_name}" "bottles/${upload_name}"
                echo "uploading ${upload_name}"
                gh release upload "${{ needs.version.outputs.tag }}" \
                  "bottles/${upload_name}" --clobber
              done
          done

      - name: Rewrite the bottle block
        # Generated rather than patched line by line: which architectures produced a
        # bottle is not known ahead of time, and a `sha256` line for a bottle that was
        # never uploaded would send Homebrew after a file that does not exist.
        run: |
          shopt -s nullglob
          jsons=(bottles/*.bottle.json)
          # Not `[ ... ] && exit 0`: the steps run under `bash -e`, where a false test as
          # the head of an AND-list fails the step.
          if [ ${#jsons[@]} -eq 0 ]; then
            echo "no bottles to write"
            exit 0
          fi
          {
            echo "  # BOTTLE-START"
            echo "  bottle do"
            echo "    root_url \"https://github.com/oetiker/mdmost/releases/download/${{ needs.version.outputs.tag }}\""
            for json in "${jsons[@]}"; do
              # `cellar` sits on the bottle, and `brew bottle` copies it onto each tag;
              # read the tag's own value first and fall back to the bottle's.
              jq -r '.[].bottle as $b | $b.tags | to_entries[]
                     | "    sha256 cellar: :\(.value.cellar // $b.cellar), \(.key): \"\(.value.sha256)\""' "$json"
            done
            echo "  end"
            echo "  # BOTTLE-END"
          } > bottle-block.txt
          cat bottle-block.txt
          # The generated block carries its own markers, so it replaces the old range
          # exactly where that range was. Substituting in place rather than deleting and
          # re-inserting is what keeps this idempotent: every release rewrites the same
          # lines instead of drifting the whitespace around them.
          grep -q '# BOTTLE-START' Formula/mdmost.rb || {
            echo "::error::the bottle markers are gone from Formula/mdmost.rb"
            exit 1
          }
          awk '
            /# BOTTLE-START/ {
              while ((getline line < "bottle-block.txt") > 0) print line
              inside = 1
              next
            }
            /# BOTTLE-END/ { inside = 0; next }
            !inside
          ' Formula/mdmost.rb > Formula/mdmost.rb.new
          mv Formula/mdmost.rb.new Formula/mdmost.rb
          cat Formula/mdmost.rb

      - name: Commit
        run: |
          if git diff --quiet Formula/mdmost.rb; then
            echo "no bottle changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mdmost.rb
          git commit -m "Homebrew bottles for ${{ needs.version.outputs.tag }}"
          git push origin main
