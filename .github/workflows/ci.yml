name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # D28: Create release PR runs this file on the release branch before it
  # opens the pull request, with the commit to test in `ref`.
  workflow_call:
    inputs:
      ref:
        description: The commit to test; empty on push and pull_request.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  lib:
    uses: ./.github/workflows/ri-ci-lib.yml
    with:
      ref: ${{ inputs.ref }}

  rust:
    uses: ./.github/workflows/ri-ci-rust.yml
    with:
      ref: ${{ inputs.ref }}

  man:
    uses: ./.github/workflows/ri-ci-man.yml
    with:
      ref: ${{ inputs.ref }}

  rust-musl:
    uses: ./.github/workflows/ri-ci-rust-musl.yml
    with:
      ref: ${{ inputs.ref }}

  # mdmost's own jobs (D25).
  ci-local:
    uses: ./.github/workflows/ci-local.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit

  release-pr-current:
    uses: ./.github/workflows/ri-release-pr-current.yml
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      ref: ${{ inputs.ref }}

  # The single context the ruleset requires (spec D2). It exists so branch
  # protection can name one check that means "this repository's CI passed",
  # whatever this repository's jobs happen to be. Its needs: list names every
  # other job of ci.yml; check verifies it (D30). Copy the rest word for word.
  #
  # `if: always()` is load-bearing. Without it this job is *skipped* when a
  # dependency fails, and a skipped job reports Success -- so the required
  # check would go green on a red build. It fails open, silently, and looks
  # like it is working.
  #
  # Release mode (D28): on a release pull request the test results do not
  # count. Create release PR tested exactly the head that carries the
  # release-built status, and the head must not be behind main. The verdict
  # is lib/release.js:releaseModeVerdict, loaded from the base commit, so a
  # release branch changed by accident cannot pass on library code it changed.
  ci-passed:
    if: always()
    needs: [lib, rust, man, rust-musl, ci-local, release-pr-current]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    # The three release-mode steps run on a pull request from a release/*
    # branch; this names that condition once.
    env:
      RELEASE_BRANCH_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
    steps:
      - if: env.RELEASE_BRANCH_PR == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: repo-infra-base

      - if: env.RELEASE_BRANCH_PR == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # An API error fails this step and so the job: a release pull request
      # whose verdict could not be read is never green.
      - id: release
        name: Release mode
        if: env.RELEASE_BRANCH_PR == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const lib = `${process.env.GITHUB_WORKSPACE}/repo-infra-base/.github/workflows/lib`;
            const releaseLib = require(`${lib}/release.js`);
            const { owner, repo } = context.repo;
            const verdict = await releaseLib.releaseModeVerdict(github, {
              owner, repo, pr: context.payload.pull_request,
            });
            // A fork's or a person's release/x gets the ordinary rules.
            if (verdict === null) {
              core.setOutput('mode', 'ordinary');
              return;
            }
            core.setOutput('mode', 'release');
            if (!verdict.ok) {
              core.setFailed(verdict.message);
              return;
            }
            core.notice(verdict.message);

      - if: steps.release.outputs.mode != 'release' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
