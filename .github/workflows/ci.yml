name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Both checks name `-p mdmost`. This is a workspace now, and its other member is
      # `vendor/pulldown-latex` — someone else's code, frozen at an upstream commit, that
      # nobody here is going to restyle. Naming the package is what keeps our standards
      # applied to our code and only to our code; `vendor/pulldown-latex/Cargo.toml`
      # carries the other half of the story.
      #
      # Measured on 2026-08-24, both checks are green over the vendored crate as well, so
      # this is not hiding a failure today. It is refusing to inherit one from a toolchain
      # bump, in code this repository has no business editing.
      - name: Check formatting
        run: cargo fmt --check -p mdmost

      - name: Run Clippy
        run: cargo clippy --all-targets -p mdmost -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Two steps, not one `--workspace`, so that a failure says which crate broke and so
      # that the mdmost number stays the number this project has always quoted. A bare
      # `cargo test` would now run only the first of these: the root manifest carries a
      # `[package]`, so cargo's default member is mdmost alone and the vendored crate's
      # tests would silently stop running.
      - name: Run tests
        run: cargo test -p mdmost

      # 72 tests plus 5 doctests, and they are the point of vendoring a *fork*: between
      # tests/errors.rs and tests/mathml.rs they are the regression tests the four
      # patches added. If these go red, one of the four has been lost.
      - name: Run the vendored crate's tests
        run: cargo test -p pulldown-latex

  windows:
    name: Windows compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A compile, not a run: nobody has exercised the pager on Windows. This leg
      # exists so the `cfg` gates in `tui::term` and `tui::stderr` stay honest.
      - name: Cargo check
        run: cargo check --all-targets -p mdmost

  docs:
    name: Manual converts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nothing consumes this page. The job exists so a manual that stops
      # converting fails the pull request that broke it, instead of surfacing at
      # release time when man/mdmost.1 is suddenly load-bearing.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build the man page
        run: make man
